name: Milestone 1

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Static checks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.15'
        run: |
          uv run --locked ruff check src/ephorate tests
          uv run --locked ruff format --check src/ephorate tests
          uv run --locked mypy src/ephorate tests
      - run: uv run --locked pytest
      - run: uv build --no-sources
      - name: Installed wheel outside checkout
        shell: bash
        run: |
          repo_root="$PWD"
          smoke_root="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_root"' EXIT
          uv run --locked python tests/fixtures/build.py --case needed_assertion --dest "$smoke_root/target"
          uv run --locked python tests/fixtures/build.py --case package_named_ephorate --dest "$smoke_root/named"
          uv venv --python '${{ matrix.python }}' "$smoke_root/venv"
          uv pip install --python "$smoke_root/venv/bin/python" "$repo_root/dist/ephorate-0.1.0a1-py3-none-any.whl" pytest==9.2.0
          cd "$smoke_root"
          "$smoke_root/venv/bin/ephorate" --help
          "$smoke_root/venv/bin/python" -m ephorate --version
          "$smoke_root/venv/bin/ephorate" check --repo "$smoke_root/target" --base HEAD^ -- pytest -q > result.json
          "$smoke_root/venv/bin/ephorate" check --repo "$smoke_root/named" --base HEAD^ -- pytest -q > named.json
          "$smoke_root/venv/bin/python" -c 'import json; reports=[json.load(open(p)) for p in ("result.json", "named.json")]; assert all(r["status"] == "complete" and r["counts"]["units"]["held"] == 1 for r in reports)'
